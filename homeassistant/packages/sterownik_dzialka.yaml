      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka tryb falownika"
      default_entity_id: sensor.dzialka_tryb_falownika
      unique_id: dzialka_tryb_falownika
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ value_json.inverter.mode }}"
      icon: mdi:power-settings
      availability_topic: "ems/sterownik-dzialka/status"
