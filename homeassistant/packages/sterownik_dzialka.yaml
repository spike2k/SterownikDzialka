# Pakiet Home Assistant dla Sterownika Dzialka EMS.
# W configuration.yaml dodaj:
# homeassistant:
#   packages: !include_dir_named packages

mqtt:
  binary_sensor:
    - name: "Sterownik działka online"
      default_entity_id: binary_sensor.dzialka_sterownik_online
      unique_id: dzialka_sterownik_online
      state_topic: "ems/sterownik-dzialka/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      device: &dzialka_device
        identifiers:
          - sterownik-dzialka
        name: "Sterownik działka EMS"
        manufacturer: "DIY"
        model: "ESP32 EMS"
        suggested_area: "Działka"

    - name: "Falownik online"
      default_entity_id: binary_sensor.dzialka_falownik_online
      unique_id: dzialka_falownik_online
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ 'ON' if value_json.inverter.online else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: connectivity
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "BMS online"
      default_entity_id: binary_sensor.dzialka_bms_online
      unique_id: dzialka_bms_online
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ 'ON' if value_json.bms.online else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: connectivity
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Alarm BMS"
      default_entity_id: binary_sensor.dzialka_alarm_bms
      unique_id: dzialka_alarm_bms
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ 'ON' if value_json.bms.alarms | int(0) > 0 else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: problem
      availability_topic: "ems/sterownik-dzialka/status"
      json_attributes_topic: "ems/sterownik-dzialka/state"
      json_attributes_template: "{{ {'kod': value_json.bms.alarmsHex} | tojson }}"
      device: *dzialka_device

    - name: "BMS ładowanie MOS"
      default_entity_id: binary_sensor.dzialka_bms_charge_mos
      unique_id: dzialka_bms_charge_mos
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ 'ON' if value_json.bms.chargeMos else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:battery-arrow-up
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "BMS rozładowanie MOS"
      default_entity_id: binary_sensor.dzialka_bms_discharge_mos
      unique_id: dzialka_bms_discharge_mos
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ 'ON' if value_json.bms.dischargeMos else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:battery-arrow-down
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "BMS balansowanie"
      default_entity_id: binary_sensor.dzialka_bms_balancing
      unique_id: dzialka_bms_balancing
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ 'ON' if value_json.bms.balancing else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:scale-balance
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

  sensor:
    - name: "Działka moc PV"
      default_entity_id: sensor.dzialka_moc_pv
      unique_id: dzialka_moc_pv
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ value_json.pvW | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka moc odbiorników"
      default_entity_id: sensor.dzialka_moc_odbiornikow
      unique_id: dzialka_moc_odbiornikow
      state_topic: "ems/sterownik-dzialka/state"
