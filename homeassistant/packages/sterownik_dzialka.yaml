      device: *dzialka_device

    - name: "Działka pozostała pojemność"
      default_entity_id: sensor.dzialka_pozostala_pojemnosc
      unique_id: dzialka_pozostala_pojemnosc
      state_topic: "ems/sterownik-dzialka/state"
