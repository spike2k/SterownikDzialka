      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ value_json.soc | float(0) }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka napięcie baterii"
