      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka prąd baterii"
      default_entity_id: sensor.dzialka_prad_baterii
      unique_id: dzialka_prad_baterii
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ value_json.batteryA | float(0) }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka moc baterii"
      default_entity_id: sensor.dzialka_moc_baterii
      unique_id: dzialka_moc_baterii
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ value_json.bms.powerW | float(0) }}"
      unit_of_measurement: "W"
