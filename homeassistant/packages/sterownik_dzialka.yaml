  select:
    - name: "Działka tryb sterowania"
      default_entity_id: select.dzialka_tryb_sterowania
      unique_id: dzialka_tryb_sterowania
      state_topic: "ems/sterownik-dzialka/mode/state"
      command_topic: "ems/sterownik-dzialka/mode/set"
      options:
        - auto
        - manual
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "ems/sterownik-dzialka/status"
      icon: mdi:state-machine
      device: *dzialka_device

  switch:
    - name: "Działka przekaźnik 1"
      default_entity_id: switch.dzialka_przekaznik_1
      unique_id: dzialka_przekaznik_1
      state_topic: "ems/sterownik-dzialka/relay/0/state"
      command_topic: "ems/sterownik-dzialka/relay/0/set"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka przekaźnik 2"
      default_entity_id: switch.dzialka_przekaznik_2
      unique_id: dzialka_przekaznik_2
      state_topic: "ems/sterownik-dzialka/relay/1/state"
      command_topic: "ems/sterownik-dzialka/relay/1/set"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka przekaźnik 3"
      default_entity_id: switch.dzialka_przekaznik_3
      unique_id: dzialka_przekaznik_3
      state_topic: "ems/sterownik-dzialka/relay/2/state"
      command_topic: "ems/sterownik-dzialka/relay/2/set"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    - name: "Działka przekaźnik 4"
      default_entity_id: switch.dzialka_przekaznik_4
      unique_id: dzialka_przekaznik_4
      state_topic: "ems/sterownik-dzialka/relay/3/state"
      command_topic: "ems/sterownik-dzialka/relay/3/set"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "ems/sterownik-dzialka/status"
      device: *dzialka_device

    # Wyjatek migracyjny: zainstalowany OpenBeken nadaje jeszcze natywne tematy.
    # Po jego rekonfiguracji OTA zamien na stat/studnia/POWER, cmnd/studnia/POWER
    # i tele/studnia/LWT, tak jak w kolejnych satelitach.
    - name: "Działka studnia"
      default_entity_id: switch.dzialka_studnia
      unique_id: dzialka_studnia
      state_topic: "studnia/0/get"
      command_topic: "studnia/0/set"
      payload_on: "1"
      payload_off: "0"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "studnia/connected"
      payload_available: "online"
      payload_not_available: "offline"
      icon: mdi:water-pump

    - name: "Działka fontanna"
      default_entity_id: switch.dzialka_fontanna
      unique_id: dzialka_fontanna
      state_topic: "stat/fontanna/POWER"
      command_topic: "cmnd/fontanna/POWER"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "tele/fontanna/LWT"
      payload_available: "Online"
      payload_not_available: "Offline"
      icon: mdi:fountain

    - name: "Działka bojler"
      default_entity_id: switch.dzialka_bojler
      unique_id: dzialka_bojler
      state_topic: "stat/bojler/POWER"
      command_topic: "cmnd/bojler/POWER"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "tele/bojler/LWT"
      payload_available: "Online"
      payload_not_available: "Offline"
      icon: mdi:water-boiler

    - name: "Działka pompa"
      default_entity_id: switch.dzialka_pompa
      unique_id: dzialka_pompa
      state_topic: "stat/pompa/POWER"
      command_topic: "cmnd/pompa/POWER"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "tele/pompa/LWT"
      payload_available: "Online"
      payload_not_available: "Offline"
      icon: mdi:pump

    - name: "Działka oświetlenie"
      default_entity_id: switch.dzialka_oswietlenie
      unique_id: dzialka_oswietlenie
      state_topic: "stat/oswietlenie/POWER"
      command_topic: "cmnd/oswietlenie/POWER"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      qos: 1
      retain: false
      availability_topic: "tele/oswietlenie/LWT"
      payload_available: "Online"
      payload_not_available: "Offline"
      icon: mdi:outdoor-lamp
