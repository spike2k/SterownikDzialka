    - name: "Działka temperatura falownika"
      default_entity_id: sensor.dzialka_temperatura_falownika
      unique_id: dzialka_temperatura_falownika
      state_topic: "ems/sterownik-dzialka/state"
      value_template: "{{ value_json.inverter.inverterC | float(0) }}"
      unit_of_measurement: "°C"
      device_class: temperature
