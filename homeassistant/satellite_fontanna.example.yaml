# Przykład do wklejenia do automations.yaml po dodaniu smart gniazdka.
# Zastąp switch.gniazdko_fontanna rzeczywistym entity_id gniazdka.
# Pierwszy trigger realizuje polecenia automatyczne kontrolera nadwyżki PV.
# Drugi pozwala później wysyłać ręczny bypass na ems/remote/fontanna/set.

- id: dzialka_fontanna_mqtt_do_gniazdka
  alias: "Działka — sterowanie fontanną z MQTT"
  mode: restart
  triggers:
    - trigger: mqtt
      topic: "ems/sterownik-dzialka/load/fontanna/set"
    - trigger: mqtt
      topic: "ems/remote/fontanna/set"
  conditions:
    - condition: template
      value_template: "{{ trigger.payload | upper in ['ON', 'OFF'] }}"
  actions:
    - choose:
        - conditions: "{{ trigger.payload | upper == 'ON' }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.gniazdko_fontanna
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.gniazdko_fontanna

- id: dzialka_fontanna_stan_do_mqtt
  alias: "Działka — stan fontanny do MQTT"
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.gniazdko_fontanna
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state is not none and trigger.to_state.state in ['on', 'off'] }}"
  actions:
    - action: mqtt.publish
      data:
        topic: "ems/remote/fontanna/state"
        payload: "{{ trigger.to_state.state | upper }}"
        qos: 1
        retain: true
